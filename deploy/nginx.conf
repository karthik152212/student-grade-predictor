# Nginx reverse proxy: port 80 -> gunicorn on 127.0.0.1:8000
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/default
#          sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Serve static files directly for performance.
    location /static/ {
        alias /home/ubuntu/student-grade-predictor/static/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
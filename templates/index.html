<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Student Grade Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="site-header">
    <h1>AI Student Grade Predictor</h1>
    <p class="subtitle">
      Estimate final marks from study hours, attendance, and previous performance.
    </p>
  </header>

  <main class="layout">
    <!-- Input panel -->
    <section class="card input-panel" aria-labelledby="inputs-title">
      <h2 id="inputs-title" class="panel-title">Your Inputs</h2>

      <div class="slider-group">
        <div class="slider-head">
          <label for="study-hours">Study Hours</label>
          <output id="study-hours-val" for="study-hours">6.0</output>
        </div>
        <input
          type="range"
          id="study-hours"
          class="slider"
          min="0"
          max="12"
          step="0.5"
          value="6"
        />
      </div>

      <div class="slider-group">
        <div class="slider-head">
          <label for="attendance-rate">Attendance (%)</label>
          <output id="attendance-rate-val" for="attendance-rate">80</output>
        </div>
        <input
          type="range"
          id="attendance-rate"
          class="slider"
          min="0"
          max="100"
          step="1"
          value="80"
        />
      </div>

      <div class="slider-group">
        <div class="slider-head">
          <label for="previous-score">Previous Score</label>
          <output id="previous-score-val" for="previous-score">70</output>
        </div>
        <input
          type="range"
          id="previous-score"
          class="slider"
          min="0"
          max="100"
          step="1"
          value="70"
        />
      </div>

      <button id="predict-btn" type="button" class="predict-btn">Predict</button>
    </section>

    <!-- Result panel -->
    <section class="card result-panel" aria-labelledby="result-title">
      <h2 id="result-title" class="panel-title">Predicted Result</h2>

      <div id="result-placeholder">
        <p class="placeholder-text">
          Adjust the sliders and hit <strong>Predict</strong>.
        </p>
      </div>

      <div id="result-content" hidden>
        <div class="marks">
          <span id="predicted-marks">--</span>
          <span class="marks-unit">/ 100</span>
        </div>
        <div class="badge-row">
          <span id="grade-badge" class="grade-badge">--</span>
        </div>
        <p id="grade-message" class="grade-message"></p>
      </div>

      <p id="error-message" class="error-message" role="alert" hidden></p>
    </section>
  </main>

  <!-- Chart -->
  <section class="card chart-card" aria-labelledby="chart-title">
    <h2 id="chart-title" class="panel-title">Trend</h2>
    <div class="chart-wrap">
      <canvas
        id="trend-chart"
        aria-label="Scatter chart of training data with the regression trend line and the current prediction highlighted"
        role="img"
      ></canvas>
    </div>
  </section>

  <footer class="site-footer">
    Built with Flask + scikit-learn, deployed on PythonAnywhere
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script id="model-data" type="application/json">{{ model_json | safe }}</script>
  <script id="train-data" type="application/json">{{ data_json | safe }}</script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

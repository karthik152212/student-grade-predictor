<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Student Grade Predictor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="site-header">
    <h1>AI Student Grade Predictor</h1>
    <p class="subtitle">
      Estimate final marks from study hours, attendance, and previous performance.
    </p>
  </header>

    <main class="home-layout">
    <!-- Input panel -->
    <section class="card input-panel" aria-labelledby="inputs-title">
      <h2 id="inputs-title" class="panel-title">Your Inputs</h2>

      <div class="slider-group">
        <div class="slider-head">
          <label for="study-hours">Study Hours</label>
          <input
            type="number"
            id="study-hours-val"
            class="value-input"
            min="0"
            max="12"
            step="0.1"
            value="6.0"
            inputmode="decimal"
            aria-label="Study hours value"
          />
        </div>
        <input
          type="range"
          id="study-hours"
          class="slider"
          min="0"
          max="12"
          step="0.1"
          value="6"
        />
      </div>

      <div class="slider-group">
        <div class="slider-head">
          <label for="attendance-rate">Attendance (%)</label>
          <input
            type="number"
            id="attendance-rate-val"
            class="value-input"
            min="0"
            max="100"
            step="1"
            value="80"
            inputmode="numeric"
            aria-label="Attendance rate value"
          />
        </div>
        <input
          type="range"
          id="attendance-rate"
          class="slider"
          min="0"
          max="100"
          step="1"
          value="80"
        />
      </div>

      <div class="slider-group">
        <div class="slider-head">
          <label for="previous-score">Previous Score</label>
          <input
            type="number"
            id="previous-score-val"
            class="value-input"
            min="0"
            max="100"
            step="1"
            value="70"
            inputmode="numeric"
            aria-label="Previous score value"
          />
        </div>
        <input
          type="range"
          id="previous-score"
          class="slider"
          min="0"
          max="100"
          step="1"
          value="70"
        />
      </div>

            <p id="predict-error" class="error-message" role="alert" hidden></p>
      <button id="predict-btn" type="button" class="predict-btn">Predict</button>
    </section>
  </main>

  <footer class="site-footer">
    Built with Flask + scikit-learn, deployed on PythonAnywhere
  </footer>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
